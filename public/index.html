<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Upload → HLS AES-128 Player</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
      }

      iframe {
        border: none;
        width: 720px;
        height: 405px;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Upload video and convert to HLS (AES-128)</h1>
    <form
      id="uploadForm"
      action="/upload"
      method="post"
      enctype="multipart/form-data"
    >
      <label
        >Video file:
        <input type="file" name="video" accept="video/*" required /> </label
      ><br /><br />
      <label
        >Segment duration (sec):
        <input type="number" name="seg" value="10" min="2" max="60" /></label
      ><br /><br />
      <button type="submit">Upload & Convert</button>
    </form>

    <div id="result"></div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
      const form = document.getElementById("uploadForm");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = new FormData(form);
        result.innerHTML = "<p>Preparing upload...</p>";

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/upload");

        xhr.upload.addEventListener("progress", (event) => {
          if (!event.lengthComputable) {
            result.innerHTML = "<p>Uploading video...</p>";
            return;
          }
          const percent = Math.round((event.loaded / event.total) * 100);
          result.innerHTML = `<p>Uploading video... ${percent}%</p>`;
        });

        xhr.addEventListener("load", () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            result.innerHTML = xhr.responseText;
          } else {
            result.innerHTML = `<pre>${xhr.responseText || xhr.statusText}</pre>`;
          }
        });

        xhr.addEventListener("error", () => {
          result.innerHTML = "<p>Upload failed. Check the server log.</p>";
        });

        xhr.upload.addEventListener("load", () => {
          result.innerHTML = "<p>Upload complete. Processing on server...</p>";
        });

        xhr.send(data);
      });

      function showPlayer(url) {
        const match = url.match(/(\/)?hls\/([^/]+)\//);
        const key = match ? match[2] : null;
        const div = document.createElement("div");
        div.className = "player";
        div.innerHTML = `<iframe src="/player.html?key=${key}" />`;
        result.appendChild(div);
      }

      showPlayer("/hls/demo/master.m3u8");
    </script>
  </body>
</html>
